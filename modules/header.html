        </text>
        <defs>
          <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4FACFE"/>
            <stop offset="100%" stop-color="#00F2FE"/>
          </linearGradient>
          <linearGradient id="shineGradient">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.8)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>
        </defs>
        <rect x="-120" y="0" width="60" height="60" fill="url(#shineGradient)" transform="skewX(-20)">
          <animate attributeName="x" from="-120" to="220" dur="2.8s" repeatCount="indefinite"/>
        </rect>
      </svg>
    </div>
  </div>

  <div class="nav-links" id="nav-links">
    <a href="#intro">Giới thiệu</a>

    <a href="#ui">Giao diện</a>
    <a href="#usage">Hướng dẫn</a>

  <div class="actions">
    <button id="theme-toggle" class="btn" aria-pressed="false" title="Chuyển giao diện">
      <svg id="theme-icon" class="icon" viewBox="0 0 24 24" fill="none">
        <path d="M12 3v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 19v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M4.2 4.2l1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M18.4 18.4l1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

<style>
/* Navbar nhỏ gọn, hiện đại */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 20px;
  background: #1E293B; /* Dark blue/modern */
  color: white;
  font-family: 'Roboto', sans-serif;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

/* Logo */
.logo-wrap svg {
  height: 40px;
  width: auto;
}

/* Links */
.nav-links {
  display: flex;
  gap: 15px;
  font-weight: 500;
}
.nav-links a {
  color: white;
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 6px;
  transition: 0.3s;
}
.nav-links a:hover {
  background: rgba(255,255,255,0.1);
}

/* Actions: theme + hamburger */
.actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn {
  background: none;
  border: none;
  cursor: pointer;
  color: white;
  display: flex;
  align-items: center;
}
.icon { width: 24px; height: 24px; }

/* Hamburger mobile */
.hamburger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
}

/* Responsive */
@media (max-width: 900px) {
  .nav-links {
    display: none;
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    background: #1E293B;
    flex-direction: column;
    gap: 0;
    padding: 10px 0;
  }
  .nav-links a {
    padding: 10px 20px;
  }
  .nav-links.show {
    display: flex;
  }

  .hamburger {
    display: block;
  }
}
</style>

<script>
// Toggle mobile menu
const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('nav-links');

hamburger.addEventListener('click', () => {
  navLinks.classList.toggle('show');
});

// Theme toggle
const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark-theme');
});
</script>
